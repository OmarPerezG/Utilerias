<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Descargar programas</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<h1>Gestor de Descargas</h1>

<div class="search-container">
  <input type="text" id="search" placeholder="Buscar programa...">
</div>

<div class="table-container">
  <table id="programsTable">
    <thead>
      <tr>
        <th>Archivo</th>
        <th>Acción</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>UltraViewer</td>
        <td><a href="downloads/UltraViewer_setup_6.6.124_en.exe" download><button class="btn">Descargar</button></a></td>
      </tr>
      <tr>
        <td>Kaspersky Free</td>
        <td><a href="downloads/kaspersky-free-21-21-7-384.exe" download><button class="btn">Descargar</button></a></td>
      </tr>
      <tr>
        <td>Zoom</td>
        <td><a href="downloads/zoom_amd64.deb" download><button class="btn">Descargar</button></a></td>
      </tr>
      <!-- Agrega más archivos duplicando la fila -->
    </tbody>
  </table>
</div>

<script>
  const searchInput = document.getElementById('search');
  const table = document.getElementById('programsTable').getElementsByTagName('tbody')[0];

  searchInput.addEventListener('keyup', function() {
    const filter = this.value.toLowerCase();
    const rows = table.getElementsByTagName('tr');

    Array.from(rows).forEach(row => {
      const cell = row.getElementsByTagName('td')[0];
      if (cell.textContent.toLowerCase().includes(filter)) {
        row.style.display = '';
      } else {
        row.style.display = 'none';
      }
    });
  });
</script>

</body>
</html>
